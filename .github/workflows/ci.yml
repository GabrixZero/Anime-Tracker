name: CI

# Roda lint e testes a cada push e em todo PR para main/develop.
# Um PR aberto pelo próprio workflow "Auto PR" (token do GitHub) não dispara workflows, por isso o push também roda;
# o grupo de concorrência cancela a execução repetida quando push e PR acontecem para o mesmo código.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e testes (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Ações fixadas pelo hash do commit (o comentário diz a versão); atualize de propósito, não por tag móvel.
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (erros quebram; avisos aparecem no log)
        run: npm run lint

      - name: Formatação dos arquivos já formatados
        run: npm run format:check

      - name: Testes
        run: npm test

  docker:
    name: Imagem Docker (build e health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Construir a imagem
        run: docker build -t showvault:ci .

      - name: Subir e verificar /health
        env:
          # Segredo descartável só deste teste (não é um segredo real).
          CI_JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef-not-a-secret
        run: |
          docker run -d --name showvault -p 3000:3000 -e JWT_SECRET="$CI_JWT_SECRET" showvault:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs showvault
          exit 1

  # Testes ponta a ponta (S12, D-25): o app de verdade num Chromium (Playwright), em desktop (1280x800) e mobile (375x812), com as
  # fontes externas SIMULADAS (nenhum teste usa a internet) e uma pasta de dados temporária. Roda junto com "test" (não depende dele).
  # Duas vezes: com arquivos JSON (padrão do desenvolvimento) e com SQLite (o modo de produção do PC e do Docker).
  e2e:
    name: E2E (Playwright, ${{ matrix.storage }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storage: [json, sqlite]
    env:
      E2E_STORAGE: ${{ matrix.storage }}
      # O navegador fica fora de node_modules para o cache sobreviver ao `npm ci` (o scripts/e2e.js respeita esta variável).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # A chave inclui o package-lock: trocar a versão do Playwright baixa o Chromium de novo; senão ele vem do cache.
      - name: Cache do Chromium (Playwright)
        id: chromium-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Baixar o Chromium e as bibliotecas do sistema
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium --no-shell

      # Com o navegador no cache ainda faltam as bibliotecas do sistema (apt), que o cache não guarda.
      - name: Instalar só as bibliotecas do sistema
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes ponta a ponta
        run: npm run test:e2e

      # Só guarda algo quando o job falhou: trace e captura de tela existem apenas para os testes que falharam (a config do Playwright
      # usa retain-on-failure / only-on-failure) e o relatório HTML mostra o passo a passo de cada um.
      - name: Guardar relatório e artefatos da falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-falha-${{ matrix.storage }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
