name: Auto PR Develop to Main

# Abre (uma vez) o PR develop -> main quando develop recebe um push.
# (Antes rodava também ao fechar PRs, o que duplicava a execução: o merge no develop já gera um push.)
on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-develop
  cancel-in-progress: false

jobs:
  create-pr-to-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Pull Request to main
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const branch = 'develop';
            const base = 'main';
            const { owner, repo } = context.repo;

            // "Nada a fazer" de verdade: sem commits novos ou PR já existente. Qualquer outro erro (permissão, rede, 5xx) falha o job.
            const isBenign = (err) => {
              if (err.status !== 422) return false;
              const text = JSON.stringify(err.response?.data ?? err.message ?? '');
              return /No commits between|pull request already exists/i.test(text);
            };

            const { data: existing } = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branch}`, base, state: 'open'
            });
            if (existing.length > 0) {
              console.log(`PR para main já aberta: #${existing[0].number}`);
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, head: branch, base,
                title: 'Release: Merge develop into main',
                body: `### Pull Request automática de release\n\nA branch **\`${branch}\`** está consolidada. Faça o merge para publicar em **\`${base}\`**.`
              });
              console.log(`PR de release criada: #${pr.number}`);
            } catch (err) {
              if (isBenign(err)) {
                console.log('Nada a abrir (develop e main iguais, ou PR já existe).');
              } else {
                core.setFailed(`Erro ao criar o PR de release: ${err.status ?? ''} ${err.message}`);
              }
            }
