name: Auto PR Feature to Develop

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Pull Request to develop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const base = 'develop';

            console.log(`Detectado push na branch: ${branch}`);

            try {
              // Verifica se já existe uma PR aberta para este par de branches
              const { data: existingPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                base: base,
                state: 'open'
              });

              if (existingPrs.length > 0) {
                console.log(`PR já existe e está aberta: #${existingPrs[0].number}`);
                return;
              }

              // Cria a PR automaticamente
              const { data: newPr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Merge ${branch} into develop`,
                head: branch,
                base: base,
                body: `### Pull Request Automática via GitHub Actions\n\nBranch **\`${branch}\`** atualizada com sucesso.\n\nBasta revisar e clicar em **Merge pull request** para incorporar as alterações na branch **\`develop\`**.`
              });

              console.log(`Pull Request criada com sucesso: #${newPr.number}`);
            } catch (err) {
              if (err.message && (err.message.includes('No commits between') || err.status === 422)) {
                console.log('Nenhuma diferença pendente de commit entre as branches. PR não necessária.');
              } else {
                console.error('Erro na criação automática da PR:', err.message);
                throw err;
              }
            }
