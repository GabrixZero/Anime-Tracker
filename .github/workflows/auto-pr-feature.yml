name: Auto PR Feature to Develop

# Abre (uma vez) o PR feature/** -> develop quando a branch recebe um push.
on:
  push:
    branches:
      - 'feature/**'

# Só o necessário: ler o repositório e criar PR. Não precisa de checkout (a API do GitHub basta).
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr-to-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Pull Request to develop
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const base = 'develop';
            const { owner, repo } = context.repo;

            // "Nada a fazer" de verdade: sem commits novos ou PR já existente. Qualquer outro erro (permissão, rede, 5xx) falha o job.
            const isBenign = (err) => {
              if (err.status !== 422) return false;
              const text = JSON.stringify(err.response?.data ?? err.message ?? '');
              return /No commits between|pull request already exists/i.test(text);
            };

            const { data: existing } = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branch}`, base, state: 'open'
            });
            if (existing.length > 0) {
              console.log(`PR já aberta: #${existing[0].number}`);
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, head: branch, base,
                title: `Merge ${branch} into develop`,
                body: `### Pull Request automática\n\nBranch **\`${branch}\`** atualizada. Revise e faça o merge em **\`${base}\`** quando estiver pronta.`
              });
              console.log(`PR criada: #${pr.number}`);
            } catch (err) {
              if (isBenign(err)) {
                console.log('Nada a abrir (sem commits novos ou PR já existe).');
              } else {
                core.setFailed(`Erro ao criar o PR: ${err.status ?? ''} ${err.message}`);
              }
            }
